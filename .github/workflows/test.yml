name: Build Ghostty (PR #13745 - macOS)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-macos:
    name: Build macOS PR #13745
    runs-on: macos-latest

    steps:
      # 1. Checkout Ghostty PR #13745 recursively with submodules
      - name: Checkout Ghostty PR #13745
        uses: actions/checkout@v4
        with:
          repository: ghostty-org/ghostty
          ref: refs/pull/13745/head
          submodules: recursive
          fetch-depth: 0

      # 2. Extract required Zig version from PR's build.zig.zon
      - name: Detect Zig Version
        id: zig-version
        run: |
          ZIG_VER=$(sed -n -E 's/^[[:space:]]*\.?minimum_zig_version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' build.zig.zon)
          echo "Detected Zig version: $ZIG_VER"
          echo "version=$ZIG_VER" >> $GITHUB_OUTPUT

      # 3. Set up the exact required Zig compiler
      - name: Setup Zig
        uses: mlugg/setup-zig@v1
        with:
          version: ${{ steps.zig-version.outputs.version }}

      # 4. Install dependencies & export gettext binaries to PATH
      - name: Install Build Dependencies
        run: |
          brew install gettext pkg-config
          echo "$(brew --prefix gettext)/bin" >> $GITHUB_PATH

      # 5. Compile Ghostty macOS application
      - name: Build Ghostty Bundle
        run: zig build -Doptimize=ReleaseFast

      # 6. Locate, Ad-hoc Sign, and Compress App Bundle
      - name: Sign & Package App Bundle
        run: |
          APP_PATH=$(find zig-out -name "Ghostty.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::Ghostty.app not found under zig-out"
            exit 1
          fi

          echo "Signing: $APP_PATH"
          codesign --force --deep --sign - "$APP_PATH"

          # Use ditto to preserve macOS symlinks, permissions, and resource forks
          echo "Creating zip archive..."
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" Ghostty-PR13745-macOS.zip

      # 7. Upload zipped artifact
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ghostty-PR13745-macOS
          path: Ghostty-PR13745-macOS.zip
